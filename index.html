<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📰 NewsNow - Latest News</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
  <div class="max-w-4xl mx-auto p-4">
    <h1 class="text-3xl font-bold mb-4 text-center">📰 Manisha News Agency</h1>

    <!-- Search Bar -->
    <div class="mb-4 flex gap-2">
      <input type="text" id="searchInput" placeholder="Search news..." class="p-2 border rounded w-full" />
      <button id="searchBtn" class="bg-blue-600 text-white px-4 rounded">Search</button>
    </div>

    <!-- Category Dropdown -->
    <select id="category" class="mb-4 p-2 border rounded">
      <option value="technology">Technology</option>
      <option value="sports">Sports</option>
      <option value="health">Health</option>
      <option value="business">Business</option>
      <option value="entertainment">Entertainment</option>
    </select>

    <!-- News Articles -->
    <div id="newsContainer" class="space-y-4"></div>
  </div>

  <script>
    const apiKey = '23201419997b4911990331c1aa248a73'; // 🔑 Replace with your actual NewsAPI key
    const newsContainer = document.getElementById('newsContainer');
    const categorySelect = document.getElementById('category');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');

    async function fetchNews(category = 'technology') {
      newsContainer.innerHTML = 'Loading...';
      const url = `https://newsapi.org/v2/top-headlines?country=us&category=${category}&apiKey=${apiKey}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        displayNews(data.articles);
      } catch (error) {
        newsContainer.innerHTML = 'Error fetching news.';
        console.error(error);
      }
    }

    function displayNews(articles) {
      newsContainer.innerHTML = '';
      if (articles.length === 0) {
        newsContainer.innerHTML = '<p>No articles found.</p>';
        return;
      }

      articles.forEach(article => {
        const newsItem = document.createElement('div');
        newsItem.className = 'bg-white p-4 rounded shadow flex flex-col md:flex-row gap-4';

        const imageUrl = article.urlToImage || 'https://via.placeholder.com/150';

        newsItem.innerHTML = `
          <img src="${imageUrl}" alt="news image" class="w-full md:w-48 h-32 object-cover rounded" />
          <div class="flex-1">
            <h2 class="text-xl font-semibold">${article.title}</h2>
            <p class="text-sm text-gray-600">${article.source.name}</p>
            <p class="mt-2">${article.description || ''}</p>
            <a href="${article.url}" target="_blank" class="text-blue-500 mt-2 inline-block">Read more</a>
          </div>
        `;

        newsContainer.appendChild(newsItem);
      });
    }

    categorySelect.addEventListener('change', (e) => {
      fetchNews(e.target.value);
    });

    searchBtn.addEventListener('click', () => {
      const query = searchInput.value.trim();
      if (query) {
        searchNews(query);
      }
    });

    async function searchNews(query) {
      newsContainer.innerHTML = 'Searching...';
      const url = `https://newsapi.org/v2/everything?q=${encodeURIComponent(query)}&apiKey=${apiKey}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        displayNews(data.articles);
      } catch (error) {
        newsContainer.innerHTML = 'Error fetching news.';
        console.error(error);
      }
    }

    fetchNews();
  </script>
</body>
</html>
